name: kvman
description: "An Unofficial client app for Kerala Vision Broadband"
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^18.0.0
  dynamic_color: ^1.8.1
  flutter_riverpod: ^3.4.2
  pinput: ^6.0.2
  dio: ^5.11.0
  flutter_dotenv: ^6.0.1
  shared_preferences: ^2.5.5
  logger: ^2.7.0
  shimmer: ^4.0.0
  intl: ^0.20.3
  local_auth: ^3.0.2
  url_launcher: ^6.3.2
  package_info_plus: ^10.2.1
  path_provider: ^2.1.6
  open_filex: ^4.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - .env

flutter_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.png"
  adaptive_icon_background: "#0c1322"
  adaptive_icon_foreground: "assets/app_icon.png"
